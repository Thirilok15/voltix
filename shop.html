<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | Voltix</title><meta name="description" content="Browse and filter all Voltix gadgets by category, price and rating.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23ff5a1f'/></svg>"></head>
<body data-page="shop"><header class="hdr" id="hdr"></header>
<main id="main">
<section class="phero"><div class="wrap"><span class="eyebrow">Shop</span><h1>All gadgets</h1><p class="lead">Search, filter and sort to find your next favourite device.</p></div></section>
<div class="wrap shop"><aside class="side" aria-label="Filters"><div><h4>Search</h4><input class="field" id="q" type="search" placeholder="Search products…" aria-label="Search products"></div>
<div><h4>Category</h4><div class="chips" id="chips"></div></div><div><h4>Max price: <span id="pv"></span></h4><input type="range" id="max" min="2000" max="100000" step="1000" value="100000" aria-label="Maximum price"></div><button class="btn ghost sm full" id="reset">Clear filters</button></aside>
<div><div class="toolbar"><span id="count" aria-live="polite"></span><select class="field" id="sort" aria-label="Sort products"><option value="pop">Most popular</option><option value="rt">Top rated</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div><div class="grid g3" id="list"></div></div></div><div style="height:60px"></div></main>
<footer class="ftr" id="ftr"></footer>
<script src="js/data.js"></script><script src="js/app.js"></script></body></html>
