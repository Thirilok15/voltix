<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Voltix</title><meta name="description" content="Get in touch with the Voltix support team.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23ff5a1f'/></svg>"></head>
<body data-page="contact"><header class="hdr" id="hdr"></header>
<main id="main">
<section class="phero"><div class="wrap"><span class="eyebrow">Contact</span><h1>We'd love to hear from you</h1><p class="lead">Questions about an order or a product? Send us a message and we'll reply within one working day.</p></div></section>
<div class="wrap contact"><form class="panel form" id="cf" novalidate><div><label for="name">Full name</label><input class="field" id="name" name="name" autocomplete="name" required><span class="err" id="e-name"></span></div>
<div><label for="email">Email</label><input class="field" id="email" name="email" type="email" autocomplete="email" required><span class="err" id="e-email"></span></div>
<div><label for="phone">Phone (optional)</label><input class="field" id="phone" name="phone" type="tel" autocomplete="tel"><span class="err" id="e-phone"></span></div>
<div><label for="msg">Message</label><textarea class="field" id="msg" name="msg" rows="5" required></textarea><span class="err" id="e-msg"></span></div>
<button class="btn acc" type="submit">Send message</button><p id="ok" hidden style="color:#15803d;font-weight:600">Thanks! Your message has been sent.</p></form>
<div class="info panel"><h3 style="margin-bottom:18px">Reach us</h3><p><b>Email</b>support@voltix.example</p><p><b>Phone</b>+91 00000 00000</p><p><b>Address</b>[Store address placeholder]</p><p><b>Hours</b>Mon–Sat, 9 am – 7 pm</p></div></div></main>
<footer class="ftr" id="ftr"></footer>
<script src="js/data.js"></script><script src="js/app.js"></script></body></html>
